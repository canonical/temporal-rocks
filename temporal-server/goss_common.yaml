file:
  /usr/bin/temporal-server:
    exists: true
    path: /usr/bin/temporal-server
    mode: '0755'
    owner: root
    group: root
    filetype: file
  /usr/bin/temporal:
    exists: true
    path: /usr/bin/temporal
    mode: '0755'
    owner: root
    group: root
    filetype: file
  /usr/bin/temporal-sql-tool:
    exists: true
    path: /usr/bin/temporal-sql-tool
    mode: '0755'
    owner: root
    group: root
    filetype: file
  /usr/bin/tdbg:
    exists: true
    path: /usr/bin/tdbg
    mode: '0755'
    owner: root
    group: root
    filetype: file
  /licenses/LICENSE-temporal-server-rock:
    exists: true
    path: /licenses/LICENSE-temporal-server-rock
    mode: '0644'
    owner: root
    group: root
    filetype: file
  /licenses/LICENSE-temporal:
    exists: true
    path: /licenses/LICENSE-temporal
    mode: '0644'
    owner: root
    group: root
    filetype: file
  /licenses/LICENSE-temporal-cli:
    exists: true
    path: /licenses/LICENSE-temporal-cli
    mode: '0644'
    owner: root
    group: root
    filetype: file
  /etc/temporal/schema/postgresql:
    exists: true
    path: /etc/temporal/schema/postgresql
    mode: '0755'
    owner: root
    group: root
    filetype: directory
user:
  ubuntu:
    exists: true
    home: /home/ubuntu
    shell: /bin/bash
group:
  ubuntu:
    exists: true
process:
  temporal-server:
    running: true
command:
  'temporal operator cluster health':
    exit-status: 0
    exec: 'pebble restart temporal-server; temporal operator cluster health'
    stdout:
    - 'SERVING'
    stderr: []
    skip: false
  'temporal-sql-tool --version':
    exit-status: 0
    exec: 'temporal-sql-tool --version'
    stdout:
    - 'temporal-sql-tool version 0.0.1'
    stderr: []
    timeout: 1000
    skip: false
