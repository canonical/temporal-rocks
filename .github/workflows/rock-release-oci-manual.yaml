name: Release changed rocks to OCI Factory

on:
  pull_request:
    paths:
      - "temporal-server/**"
      - "temporal-ui/**"
      - ".github/workflows/rock-release-oci-manual.yaml"

  push:
    branches:
      - main
    paths:
      - "temporal-server/**"
      - "temporal-ui/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  changed-rocks:
    uses: canonical/workflows-team/.github/workflows/get_modified_directories_by_marker.yaml@main
    with:
      marker: rockcraft.yaml
      base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  release:
    name: Release ${{ matrix.rock-directory }}
    needs: changed-rocks
    if: ${{ needs.changed-rocks.outputs.paths != '[]' && needs.changed-rocks.outputs.paths != '' }}

    strategy:
      fail-fast: false
      matrix:
        rock-directory: ${{ fromJSON(needs.changed-rocks.outputs.paths) }}

    uses: canonical/workflows-team/.github/workflows/rock-release-oci-factory.yaml@test-oci-workflow

    with:
      source-repository: canonical/temporal-rocks
      source-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      rock-directory: ${{ matrix.rock-directory }}
      rock-support: minor
      risk-track: stable
      dry-run: ${{ github.event_name == 'pull_request' }}

    secrets: inherit
